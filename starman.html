<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Games | Portal Futurista</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="css/starman.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="lib/phaser.js"></script>    
    <script src="app/app.js"></script> 

    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "author": {
    "@type": "Person",
    "name": "José Aparecido Finamor"
  },
  "copyrightHolder": {
    "@type": "Finakorgo Co",
    "name": "Nexus Games"
  }
}
</script>
  
</head>
<body>
    <div class="scanline"></div>

    <header>
        <h1>Nexus Games</h1>
        <p class="subtitle">A Próxima Fronteira do Entretenimento</p>
    </header>

    <div class="container">
        <!-- Container do Jogo Starman --> 
        <h2 class="subtitle"> Starman </h2>
        <div id="stage">
             <div id="pop"></div>  
        </div>
                
    </div>

    <section> 
         <div id="name-input-container">
            <label for="player-name" style="color: teal; font-weight: bold;">Digite seu nome para o Ranking:</label><br>
            <input type="text" id="player-name" placeholder="Seu Nome" maxlength="15">
          </div> 
         <!--==^.^== Ranking ==^.^== -->
        <div id="ranking-container">
        <h5 class="subtitle">🏆 Top 5 Ranking</h5>
        <ul id="ranking-list" class="game-desc">
            <!-- Ranking será preenchido via JS -->
        </ul>
        </div>

        <!-- Botão de Música -->
        <button id="musicBtn">🎵 Ligar Música </button>
       <!-- Score Externo -->  
        <div id="externalScore">Score: 0</div>    
    </section>

       

    <footer>
        &copy; 2026 Nexus Games Portal | Desenvolvido com tecnologia de ponta
    </footer>
</body>
</html>
